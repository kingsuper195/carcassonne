<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <title>Carcassonne Simulator</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #tiles {
            width: 100%;
            height: 100%;
        }

        #menu {
            z-index: 1;
            position: absolute;
            padding: 0;
            margin: 0;
            top: 1em;
            left: calc(100% - 21em);
            text-align: right;
        }

        #menuExpanded {
            position: absolute;
            width: 20em;
            display: none;
            margin: 0;
            border-width: 0.2em;
            border-style: solid;
            border-color: black;
            padding: 1em;
            background-color: white;
            color: black;
            text-align: left;
            box-sizing: border-box;
        }

        #menuButton {
            z-index: 2;
            margin: 0;
            top: 0.2em;
            left: 22.1em;
            position: absolute;
        }
    </style>
</head>

<body>
    <canvas id="tiles"></canvas>
    <div id="menu">
        <button id="menuButton">≣</button>
        <div id="menuExpanded">HI<br>HI</div>
    </div>
    <script src="index.js"></script>
</body>

</html>
